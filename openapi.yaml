openapi: 3.1.0
info:
  title: API de commande conversationnelle Givaudan
  version: 0.1.0
  description: >
    Contrat d'API du prototype (thématique 2). Version de travail : les routes
    marquées « à construire » ne sont pas encore implémentées.
    Voir docs/adr/0005-contrat-api-openapi-first.md.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Vérifie que l'API et la base répondent (existe)
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string }
  /api/chat:
    post:
      summary: Envoie un message du client et reçoit la réponse de l'assistant (à construire)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Réponse de l'assistant, avec des références suggérées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Message manquant
  /api/products:
    get:
      summary: Cherche des références du catalogue (à construire)
      parameters:
        - name: universe
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Universe' }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Références correspondantes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
  /api/orders:
    get:
      summary: Liste les commandes et demandes d'échantillons du client (à construire)
      responses:
        '200':
          description: Commandes du client
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      summary: Crée une commande ou une demande d'échantillon (à construire)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Commande invalide
components:
  schemas:
    Universe:
      type: string
      description: Parfums (fragrance) et arômes (flavor) sont deux parcours distincts.
      enum: [fragrance, flavor]
    ChatRequest:
      type: object
      required: [message, universe]
      properties:
        message:
          {
            type: string,
            example: Je cherche une senteur premium pour une gamme de savons,
          }
        universe: { $ref: '#/components/schemas/Universe' }
        conversationId: { type: string, format: uuid }
    ChatResponse:
      type: object
      required: [conversationId, reply]
      properties:
        conversationId: { type: string, format: uuid }
        reply: { type: string }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/Product' }
    Product:
      type: object
      required: [id, name, universe]
      properties:
        id: { type: string }
        name: { type: string }
        universe: { $ref: '#/components/schemas/Universe' }
        description: { type: string }
    OrderRequest:
      type: object
      required: [productId, quantity, kind]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        kind: { type: string, enum: [order, sample] }
    Order:
      type: object
      required: [id, productId, quantity, kind, status]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        kind: { type: string, enum: [order, sample] }
        status:
          { type: string, enum: [received, preparing, shipped, delivered] }
